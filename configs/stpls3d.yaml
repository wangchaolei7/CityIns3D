foundation_model:
  # Recognize-Anything Model PLUS
  ram_checkpoint: '../pretrains/foundation_models/ram_plus_swin_large_14m.pth'
  # Grounding DINO
  grounded_config_file: './segmenter2d/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py'
  grounded_checkpoint: '../pretrains/foundation_models/groundingdino_swint_ogc.pth'
  box_threshold: 0.01 # 0.4→0.5，增加box和类别匹配置信度, yoloworld置信度较低，应设置为0.01
  text_threshold: 0.25
  # YOLO-World
  yoloworld_config_file: './segmenter2d/YOLO-World/configs/pretrain/yolo_world_v2_x_vlpan_bn_2e-3_100e_4x8gpus_obj365v1_goldg_train_lvis_minival.py'
  yoloworld_checkpoint: '../pretrains/foundation_models/yolo_world_v2_x_obj365v1_goldg_cc3mlite_pretrain_1280ft-14996a36.pth'
  # Segment Anything Model
  sam_checkpoint: '../pretrains/foundation_models/sam_vit_h_4b8939.pth'
  # SAM3
  sam3_repo_path: '/home/wangcl/sam3'
  sam3_checkpoint: '/data1/wangcl/project/CityIns3D/sam3_checkpoint/sam3.pt'
  sam3_confidence_threshold: 0.35
  sam3_prompt_template: '{label}'
  sam3_inference_mode: 'batched' # 或 'sequential'
  sam3_log_timing: False
  sam3_compile: False
  sam3_stage2_enable: True
  sam3_stage2_spp_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_utonia_reg20'
  sam3_stage2_visible_ratio_thresh: 0.3
  sam3_stage2_min_uncovered_pixels: 100
  sam3_stage2_overlap_with_stage1_thresh: 0.5
  sam3_stage2_nms_iou_thresh: 0.5
  sam3_stage2_confidence_threshold: 0.3
  sam3_stage2_uncovered_purity_thresh: 0.2
  sam3_stage2_max_prompts_per_frame: 32
  sam3_stage2_region_dilate: 5
  sam3_stage2_region_close: 5
  mapping_log_profile: True
  mapping_auto_sparse_txt: True
  mapping_visibility_threshold: 1.0
  mapping_visibility_mode: "dynamic"
  mapping_dynamic_vis_scale: 0.01
  mapping_dynamic_vis_min: 0.05
  mapping_ply_visibility_threshold: 1.0
  mapping_ply_visibility_mode: "dynamic"
  mapping_ply_dynamic_vis_scale: 0.01
  mapping_ply_dynamic_vis_min: 0.05
  mapping_txt_visibility_threshold: 1.0
  mapping_txt_visibility_mode: "dynamic"
  mapping_txt_dynamic_vis_scale: 0.03
  mapping_txt_dynamic_vis_min: 0.20
  mask_valid_crop_pad: 10
  mask_valid_close: 11
  mask_valid_dilate: 5
  mask_valid_overlap_thresh: 0.3
  mask_clip_to_valid: True
  # SAM2
  sam2_model_config: "configs/sam2.1/sam2.1_hiera_l.yaml" 
  sam2_checkpoint: "/home/Data/data3/wcl/offline_wheel/sam2.1_hiera_large.pt"
  # Utonia
  utonia_repo_path: './segmenter3d/Utonia'
  utonia_checkpoint: 'utonia'
  utonia_repo_id: 'Pointcept/Utonia'
  utonia_scale: 0.2
  utonia_apply_z_positive: False
  utonia_normalize_coord: False
  utonia_upcast_levels: 4
  utonia_superpoint_upcast_levels: 2
  utonia_output_dtype: 'float16'
  utonia_fallback_patch_size: 1024
  tgc_repo_path: './segmenter3d/torch-graph-components/src'
  # CLIP
  clip_model: 'ViT-L/14@336px'
  device: 'cuda'
  clip_dim: 768
  siglip_dim: 1152

### Current supported segmenter2ds
# ['Grounded-SAM': GDino + SAM || 
# 'RAM Grounded-SAM': RAM + GDino + SAM || 
# 'YoloW-SAM': YOLO-World + SAM ||
# 'RAM YoloW-SAM: RAM+ YOLO-World + SAM]'
###
segmenter2d:
  # model: 'Grounded-SAM' # select 2D segmenter ⭐
  # model: 'YoloW-SAM_Stpls3d'
  # model: 'SAM'
  model: 'SAM3_Stpls3d'
  # model: 'SAM_Stpls3d'
  # model: 'Grounded-SAM2'

grounded_feature:
  granularity: 0.8 # only for SAM AutoMaskGen

data:
  dataset_name: 'stpls3d'
  split_path: './open3dis/dataset_outdoor/stpls3d_val.txt'
  datapath: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/2D' # RGB-D + pose path
  gt_pth: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/groundtruth' # gt path
  original_ply: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/original_ply_files' # raw pcl
  # spp_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_utonia' 
  spp_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_utonia_reg20'
  # spp_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_native' 
  point_features_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/utonia_point_features' # point-level feature path
  cls_agnostic_3d_proposals_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/isbnet_clsagnostic_scannet200' # cls agnostic 3D proposals
  dc_features_path: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/sppfeatures' # spp feature path
  img_dim: [2000, 2000] # coord alignment
  rgb_img_dim: [2000, 2000]
  cut_num_pixel_boundary: 0
  img_interval: 1
  num_classes: 12

superpoint:
  method: 'utonia_voxel_graph_overseg'
  save_dir: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/utonia_superpoints'
  proto_grid_size: 0.2
  graph_connectivity: 6
  graph_feature_threshold: 0.78
  graph_merge_small_components: True
  graph_min_component_voxels: 3
  graph_min_component_points: 64
  graph_merge_sim_threshold: 0.72
  graph_edge_chunk_size: 262144
  cluster_method: 'hdbscan'
  hdbscan_min_cluster_size: 20
  hdbscan_min_samples: 10
  prototype_feature_normalize: True
  feature_weight: 1.0
  coord_weight: 0.35
  pca_dim: 16
  assignment_chunk_size: 32768
  fallback_num_prototypes: 256
  component_connectivity: 6
  tgc_native_output_dir: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_native'
  tgc_utonia_output_dir: '/data1/wangcl/dataset/open_3d/STPLS3D_Open3DIS/3D/tgc_superpoints_utonia_reg20'
  tgc_voxel_size: 0.1
  tgc_native_voxel_size: 0.25
  tgc_utonia_voxel_size: 0.25
  tgc_graph_connectivity: 6
  tgc_reg: 1.0
  tgc_native_reg: 5.0
  tgc_utonia_reg: 40.0
  tgc_min_size: 64
  tgc_native_min_size: 256
  tgc_utonia_min_size: 256
  tgc_merge_only_small: False
  tgc_k: -1
  tgc_native_k: 4
  tgc_utonia_k: -1
  tgc_w_adjacency: -1.0
  tgc_native_w_adjacency: 1.0
  tgc_utonia_w_adjacency: -1.0
  tgc_sharding: 0.25
  tgc_reduce: 'add'
  tgc_native_color_weight: 1.0
  tgc_native_coord_weight: 0.25
  tgc_utonia_pca_dim: 16
  tgc_utonia_pca_fit_samples: 20000
  tgc_utonia_edge_weight_mode: 'similarity'
  tgc_utonia_edge_weight_floor: 0.05
  tgc_auto_sparse_txt: True
  tgc_txt_utonia_voxel_size: 1.2
  tgc_txt_graph_connectivity: 26
  tgc_txt_utonia_reg: 40.0
  tgc_txt_utonia_min_size: 64
  tgc_txt_utonia_k: -1
  tgc_txt_utonia_w_adjacency: 1.0
  tgc_txt_utonia_edge_weight_floor: 0.02

cluster:
  visi: 0.9 # iou
  recall: 0.9 # recall
  simi: 0.9 # dc_feats
  point_visi: 0.2  #0.2
  valid_points: 50
  enable_splitting: True
  split_method: 'dbscan'
  split_dbscan_eps: 0.5
  split_dbscan_min_samples: 50
  split_hdbscan_min_cluster_size: 50
  split_hdbscan_min_samples: 20
  split_cluster_min_points: 50
  grow_feature_threshold: 0.6
  grow_min_seed_overlap: 0.5
  grow_use_geometry: False
  grow_centroid_dist_threshold: 1.5
  update_seed_stats: False
  merge_feature_veto: True
  merge_feature_veto_threshold: 0.3
  spp_graph_mode: 'point_knn'
  spp_graph_k: 8
  spp_graph_max_neighbor_dist:
  feature_pool_chunk_size: 64
  part_support_metric: 'cosine'
  part_affinity_alpha: 0.7
  part_affinity_thresholds: [0.75, 0.65, 0.55, 0.45]
  part_min_points: 50
  part_min_spp: 1
  part_min_support: 0.02
  part_min_confidence: 0.0
  part_reassign_use_feature_tiebreak: True
  part_reassign_tie_margin: 0.005
  part_final_component_min_spp: 1
  part_final_component_min_points: 80

refine_grounding:
  top_k: 5 #⭐从5修改到2

final_instance:
  spp_level: sppgrow_stpls3d 
  duplicate: True
  iou_overlap: 0.9
  top_k: 300
  scale_semantic_score: 300.0

exp:
  exp_name: "version_SAM3"  # for ablation study
  # exp_name: "version_YoloW-SAM"  # for ablation study
  mask2d_output: 'mask_sam3_stage1' # final merged 2D masks /// stage12: 1+2 mask结果
  mask2d_output_stage1: 'mask_sam3_stage1'
  mask2d_output_stage2: 'mask_sam3_stage2'
  grounded_feat_output: 'grounded_feat' # first stage feature
  refined_grounded_feat_output: 'refined_grounded_feat' # second stage feature
  clustering_3d_output: '3d_ins_img16' # 2Dlift path
  clustering_3d_output_lifted_part: 'txt_3d_ins_img16_lifted_part_stage1'
  final_output: 'final_result_hier_agglo' 
  save_dir: '/data1/wangcl/project/CityIns3D/stpls3d/'


proposals:
  p2d: True # 2D branch
  p3d: False # 3D branch ⭐修改为False
  agnostic: False # returning class-agnostic masks (without class + scores)
  refined: True # feature branch, setting this True uses refined feature, else uses feature from 2D branch
                # refer to VinAI-3DIS solution (two-stage feature): https://arxiv.org/pdf/2402.15321.pdf 
  dc_feat_not_geo_feat: True

evaluate:
  evalvocab: False # AP evaluation for OV-3DIS ⭐修改为True
  evalagnostic: False # AP evaluation for agnostic 3DIS

agglomerative: #⭐添加sequential
  hierarchical: True
  sequential: False


fp16: True
